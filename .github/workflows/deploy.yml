name: Secure Deploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Inject Firebase Secrets (Safe Python)
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          python3 << 'PY'
          import os
          path = "index.html"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          replacements = {
              "__FIREBASE_API_KEY__": os.environ.get("FIREBASE_API_KEY",""),
              "__FIREBASE_AUTH_DOMAIN__": os.environ.get("FIREBASE_AUTH_DOMAIN",""),
              "__FIREBASE_DATABASE_URL__": os.environ.get("FIREBASE_DATABASE_URL",""),
              "__FIREBASE_PROJECT_ID__": os.environ.get("FIREBASE_PROJECT_ID",""),
              "__FIREBASE_STORAGE_BUCKET__": os.environ.get("FIREBASE_STORAGE_BUCKET",""),
              "__FIREBASE_MESSAGING_SENDER_ID__": os.environ.get("FIREBASE_MESSAGING_SENDER_ID",""),
              "__FIREBASE_APP_ID__": os.environ.get("FIREBASE_APP_ID",""),
              "YOUR_API_KEY": os.environ.get("FIREBASE_API_KEY",""),
              "YOUR_PROJECT_ID": os.environ.get("FIREBASE_PROJECT_ID",""),
              "YOUR_APP_ID": os.environ.get("FIREBASE_APP_ID",""),
          }

          for k,v in replacements.items():
              content = content.replace(k, v)

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)

          print("✅ Firebase config injected safely with Python")
          # Verify no placeholder remains
          if "__FIREBASE_" in content:
              print("❌ Placeholder still exists!")
              exit(1)
          PY

      - name: Deploy Firebase Functions (Optional)
        if: hashFiles('functions/package.json') != ''
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "No service account secret - skipping functions deploy"
            exit 0
          fi
          echo "$FIREBASE_SERVICE_ACCOUNT" > service-account.json
          export GOOGLE_APPLICATION_CREDENTIALS=$PWD/service-account.json
          npm install -g firebase-tools
          cd functions && npm install && cd ..
          firebase functions:config:set telegram.token="$TELEGRAM_BOT_TOKEN" telegram.chat_id="$TELEGRAM_CHAT_ID" --project "$FIREBASE_PROJECT_ID" || true
          firebase deploy --only functions --project "$FIREBASE_PROJECT_ID" || echo "Functions deploy skipped"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Deploy Google Marketing Portfolio

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Inject public web configuration
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
        run: |
          python3 <<'PY'
          import os
          from pathlib import Path

          path = Path('index.html')
          if not path.exists():
              raise SystemExit('ERROR: index.html is missing from the repository root.')

          replacements = {
              '__FIREBASE_API_KEY__': os.environ.get('FIREBASE_API_KEY', ''),
              '__FIREBASE_AUTH_DOMAIN__': os.environ.get('FIREBASE_AUTH_DOMAIN', ''),
              '__FIREBASE_DATABASE_URL__': os.environ.get('FIREBASE_DATABASE_URL', ''),
              '__FIREBASE_PROJECT_ID__': os.environ.get('FIREBASE_PROJECT_ID', ''),
              '__FIREBASE_STORAGE_BUCKET__': os.environ.get('FIREBASE_STORAGE_BUCKET', ''),
              '__FIREBASE_MESSAGING_SENDER_ID__': os.environ.get('FIREBASE_MESSAGING_SENDER_ID', ''),
              '__FIREBASE_APP_ID__': os.environ.get('FIREBASE_APP_ID', ''),
              '__IMGBB_API_KEY__': os.environ.get('IMGBB_API_KEY', ''),
          }
          missing = [key for key, value in replacements.items() if not value.strip()]
          if missing:
              raise SystemExit('ERROR: Add these GitHub Actions secrets before deploying: ' + ', '.join(missing))

          content = path.read_text(encoding='utf-8')
          for marker, value in replacements.items():
              content = content.replace(marker, value)
          remaining = [marker for marker in replacements if marker in content]
          if remaining:
              raise SystemExit('ERROR: Configuration placeholders remain in index.html: ' + ', '.join(remaining))
          path.write_text(content, encoding='utf-8')
          print('Public Firebase and ImgBB configuration injected; no server-side credentials were included.')
          PY

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'index.html'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Secure Deploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Inject Firebase Secrets
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          echo "Injecting Firebase config from Secrets..."
          sed -i "s|__FIREBASE_API_KEY__|$FIREBASE_API_KEY|g" index.html
          sed -i "s|__FIREBASE_AUTH_DOMAIN__|$FIREBASE_AUTH_DOMAIN|g" index.html
          sed -i "s|__FIREBASE_DATABASE_URL__|$FIREBASE_DATABASE_URL|g" index.html
          sed -i "s|__FIREBASE_PROJECT_ID__|$FIREBASE_PROJECT_ID|g" index.html
          sed -i "s|__FIREBASE_STORAGE_BUCKET__|$FIREBASE_STORAGE_BUCKET|g" index.html
          sed -i "s|__FIREBASE_MESSAGING_SENDER_ID__|$FIREBASE_MESSAGING_SENDER_ID|g" index.html
          sed -i "s|__FIREBASE_APP_ID__|$FIREBASE_APP_ID|g" index.html
          if grep -q "__FIREBASE_" index.html; then
            echo "❌ ERROR: Placeholder still exists!"
            exit 1
          fi
          echo "✅ Firebase Secrets injected!"

      - name: Setup Node (for Functions)
        if: vars.DEPLOY_FUNCTIONS == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy Firebase Functions with Service Account
        if: vars.DEPLOY_FUNCTIONS == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > service-account.json
          export GOOGLE_APPLICATION_CREDENTIALS=$PWD/service-account.json
          npm install -g firebase-tools
          cd functions && npm install && cd ..
          firebase functions:config:set telegram.token="$TELEGRAM_BOT_TOKEN" telegram.chat_id="$TELEGRAM_CHAT_ID" --project "$FIREBASE_PROJECT_ID"
          firebase deploy --only functions --project "$FIREBASE_PROJECT_ID"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

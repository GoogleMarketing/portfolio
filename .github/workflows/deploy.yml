name: Secure Deploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Inject Firebase Secrets (Safe Python)
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          python3 << 'PY'
          import os
          path = "index.html"
          # Check if index.html exists, else try other names
          if not os.path.exists(path):
              for alt in ["index-final.html", "index-fixed.html", "index-final-robust.html"]:
                  if os.path.exists(alt):
                      print(f"Found {alt}, renaming to index.html")
                      import shutil
                      shutil.copy(alt, path)
                      break
          
          if not os.path.exists(path):
              print("❌ No index file found!")
              exit(1)
              
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          # Check if secrets are set
          api_key = os.environ.get("FIREBASE_API_KEY","")
          if not api_key or len(api_key) < 10:
              print("⚠️ WARNING: FIREBASE_API_KEY secret not set or too short!")
              print("Site will deploy in OFFLINE mode - UI will work but auth will show warning")
              print("To fix: Go to Repo Settings > Secrets > Actions and add 7 Firebase secrets")
              # Don't fail, allow offline deployment
          else:
              print(f"✅ API Key found (length {len(api_key)})")

          replacements = {
              "__FIREBASE_API_KEY__": os.environ.get("FIREBASE_API_KEY",""),
              "__FIREBASE_AUTH_DOMAIN__": os.environ.get("FIREBASE_AUTH_DOMAIN",""),
              "__FIREBASE_DATABASE_URL__": os.environ.get("FIREBASE_DATABASE_URL",""),
              "__FIREBASE_PROJECT_ID__": os.environ.get("FIREBASE_PROJECT_ID",""),
              "__FIREBASE_STORAGE_BUCKET__": os.environ.get("FIREBASE_STORAGE_BUCKET",""),
              "__FIREBASE_MESSAGING_SENDER_ID__": os.environ.get("FIREBASE_MESSAGING_SENDER_ID",""),
              "__FIREBASE_APP_ID__": os.environ.get("FIREBASE_APP_ID",""),
          }

          for k,v in replacements.items():
              content = content.replace(k, v)

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)

          if "__FIREBASE_" in content:
              print("⚠️ WARNING: Placeholder still exists - Secrets not set!")
              print("Deploying in OFFLINE mode - Menu, Chat, UI will still work")
              print("But Sign Up/Login will show 'Firebase not configured' message")
              # Don't exit(1) - allow deployment to succeed
          else:
              print("✅ Firebase config injected safely - Full features enabled")
          PY

      - name: Deploy Firebase Functions (Telegram Bot Fix)
        if: hashFiles('functions/package.json') != ''
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "⚠️ No service account - skipping functions (optional)"
            exit 0
          fi
          echo "$FIREBASE_SERVICE_ACCOUNT" > service-account.json
          export GOOGLE_APPLICATION_CREDENTIALS=$PWD/service-account.json
          npm install -g firebase-tools
          cd functions && npm install && cd ..
          firebase functions:config:set telegram.token="$TELEGRAM_BOT_TOKEN" telegram.chat_id="$TELEGRAM_CHAT_ID" --project "$FIREBASE_PROJECT_ID" || true
          firebase deploy --only functions --project "$FIREBASE_PROJECT_ID" || echo "Functions deploy skipped - check secrets"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

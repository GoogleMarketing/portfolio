name: Deploy Portfolio to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare frontend build
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          TELEGRAM_BRIDGE_URL: ${{ secrets.TELEGRAM_BRIDGE_URL }}
        run: |
          echo "Injecting secrets using Python (safe replacement)..."
          BRIDGE_URL="${TELEGRAM_BRIDGE_URL:-https://portfolio-live-chat-bot.onrender.com/api/bridge}"
          python3 << 'PY'
          import os
          replacements = {
            "__FIREBASE_API_KEY__": os.environ.get("FIREBASE_API_KEY",""),
            "__FIREBASE_AUTH_DOMAIN__": os.environ.get("FIREBASE_AUTH_DOMAIN",""),
            "__FIREBASE_DATABASE_URL__": os.environ.get("FIREBASE_DATABASE_URL",""),
            "__FIREBASE_PROJECT_ID__": os.environ.get("FIREBASE_PROJECT_ID",""),
            "__FIREBASE_STORAGE_BUCKET__": os.environ.get("FIREBASE_STORAGE_BUCKET",""),
            "__FIREBASE_MESSAGING_SENDER_ID__": os.environ.get("FIREBASE_MESSAGING_SENDER_ID",""),
            "__FIREBASE_APP_ID__": os.environ.get("FIREBASE_APP_ID",""),
            "__IMGBB_API_KEY__": os.environ.get("IMGBB_API_KEY",""),
            "__TELEGRAM_BRIDGE_URL__": os.environ.get("TELEGRAM_BRIDGE_URL") or "https://portfolio-live-chat-bot.onrender.com/api/bridge",
          }
          with open("index.html","r",encoding="utf-8") as f:
            content = f.read()
          for k,v in replacements.items():
            content = content.replace(k, v)
          # Also replace hardcoded default bridge url if custom provided
          custom_bridge = os.environ.get("TELEGRAM_BRIDGE_URL")
          if custom_bridge and custom_bridge != "https://portfolio-live-chat-bot.onrender.com/api/bridge":
            content = content.replace("https://portfolio-live-chat-bot.onrender.com/api/bridge", custom_bridge)
          with open("index.html","w",encoding="utf-8") as f:
            f.write(content)
          print("All placeholders replaced safely")
          PY
          mkdir -p _site
          cp index.html _site/index.html
          touch _site/.nojekyll
          echo "Build ready"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

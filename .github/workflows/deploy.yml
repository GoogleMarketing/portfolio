name: Deploy Google Marketing Portfolio

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build public website and inject Firebase configuration
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
        run: |
          python3 <<'PY'
          import os
          import re
          import shutil
          from pathlib import Path

          replacements = {
              '__FIREBASE_API_KEY__': os.environ.get('FIREBASE_API_KEY', '').strip(),
              '__FIREBASE_AUTH_DOMAIN__': os.environ.get('FIREBASE_AUTH_DOMAIN', '').strip(),
              '__FIREBASE_DATABASE_URL__': os.environ.get('FIREBASE_DATABASE_URL', '').strip(),
              '__FIREBASE_PROJECT_ID__': os.environ.get('FIREBASE_PROJECT_ID', '').strip(),
              '__FIREBASE_STORAGE_BUCKET__': os.environ.get('FIREBASE_STORAGE_BUCKET', '').strip(),
              '__FIREBASE_MESSAGING_SENDER_ID__': os.environ.get('FIREBASE_MESSAGING_SENDER_ID', '').strip(),
              '__FIREBASE_APP_ID__': os.environ.get('FIREBASE_APP_ID', '').strip(),
              '__IMGBB_API_KEY__': os.environ.get('IMGBB_API_KEY', '').strip(),
          }

          missing = [marker for marker, value in replacements.items() if not value]
          if missing:
              raise SystemExit('ERROR: Add these GitHub Actions secrets: ' + ', '.join(missing))

          invalid = [marker for marker, value in replacements.items()
                     if value.startswith(('__', 'PASTE_')) or marker in value]
          if invalid:
              raise SystemExit('ERROR: One or more Actions secrets still contain placeholder text: ' + ', '.join(invalid))

          # _site ফোল্ডার প্রস্তুত - পুরো সাইট কপি করো, শুধু index.html না
          site = Path('_site')
          if site.exists():
              shutil.rmtree(site)
          site.mkdir(exist_ok=True)

          exclude_names = {'.git', '.github', '_site', '.gitignore', 'README.md'}
          for item in Path('.').iterdir():
              if item.name in exclude_names:
                  continue
              dest = site / item.name
              if item.is_dir():
                  shutil.copytree(item, dest, dirs_exist_ok=True)
              else:
                  shutil.copy2(item, dest)

          # এখন _site এর ভিতরে সব .html, .js, .json ফাইলে replace করো
          patterns = ['*.html', '*.js', '*.json']
          targets = []
          for pat in patterns:
              targets.extend(site.rglob(pat))

          injected_files = []
          placeholder_found_anywhere = False

          for target in targets:
              try:
                  content = target.read_text(encoding='utf-8')
              except Exception:
                  continue  # binary বা পড়া যায় না এমন ফাইল skip

              original = content
              for marker, value in replacements.items():
                  if marker in content:
                      placeholder_found_anywhere = True
                      content = content.replace(marker, value)

              if content != original:
                  target.write_text(content, encoding='utf-8')
                  injected_files.append(str(target.relative_to(site)))

          if not placeholder_found_anywhere:
              raise SystemExit('ERROR: কোনো ফাইলেই __FIREBASE_...__ placeholder পাওয়া যায়নি। index.html এ placeholder আছে কিনা চেক করো।')

          # শেষ চেক - কোথাও placeholder রয়ে গেছে কিনা
          remaining = []
          for target in targets:
              try:
                  c = target.read_text(encoding='utf-8')
                  if re.search(r'__FIREBASE_[A-Z_]+__|__IMGBB_[A-Z_]+__', c):
                      remaining.append(str(target.relative_to(site)))
              except Exception:
                  pass

          if remaining:
              raise SystemExit(f'ERROR: Unresolved placeholder রয়ে গেছে এই ফাইলগুলোতে: {", ".join(remaining)}')

          print(f'Success! Injected Firebase config into {len(injected_files)} files: {", ".join(injected_files)}')
          print(f'Publishing full site from _site/ ({len(list(site.rglob("*")))} files total)')
          PY

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
